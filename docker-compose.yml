services:
  ff:
    image: flaskfarm/flaskfarm:4.1
    container_name: ff
    network_mode: host
    restart: always
    privileged: true

    volumes:
      # FlaskFarm persistent data and plugins
      - /docker/FF/data:/data

      # Docker Engine API access for the service manager plugin
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/service-manager-agent.sock:/run/service-manager-agent.sock

      # Host and media paths used by the existing installation
      - /:/host
      - /mnt:/mnt:rshared
      - /usr/lib/plexmediaserver:/usr/lib/plexmediaserver:rshared
      - /var/lib/plexmediaserver:/var/lib/plexmediaserver:rshared
      - /volume1:/volume1:rshared
